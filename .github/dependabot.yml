# Weekly dependency updates, opened against `develop`: GitHub Actions (pinned by commit SHA), the Terraform
# providers and modules of every configuration, the test stack's images and the test host's base image.
# Minor and patch updates arrive grouped in one pull request; major updates arrive one by one.
# The production images (Caddy, PostgreSQL, MediaMTX, the API) are Ansible variables
# (ansible/roles/app/defaults), outside Dependabot's reach: they change through releases of this repository.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "ci(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "terraform"
    directories:
      - "/bootstrap"
      - "/bootstrap-azure"
      - "/envs/*"
      - "/modules/*"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      # azurerm 5 has breaking changes: the module and the env move to it in a planned migration, not a bump.
      - dependency-name: "hashicorp/azurerm"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker-compose"
    directories:
      - "/compose"
      - "/test"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "build(deps)"
    groups:
      compose-images:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/test/host"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "build(deps)"
    ignore:
      # The test host mirrors the production VM (Ubuntu 24.04 LTS): no interim releases, and a new LTS is
      # adopted together with production, not by a bump here.
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
