name: Ansible

# The Ansible part of CI (ci.yml calls it; docs/deploy.md): yamllint, ansible-lint, the playbook syntax check,
# docker compose config, and a deploy of the whole site.yml to a containerized Ubuntu 24.04 host with the
# smoke test and the running-image check. The test host runs the API built from te-tengo-general-api's
# develop (a public repository, checked out with the workflow token). release.yml skips the deploy test
# (deploy-test: false): its verification job deploys the release commit with the API image in production.
on:
  workflow_call:
    inputs:
      deploy-test:
        description: Deploy site.yml to the containerized host and smoke-test it
        type: boolean
        default: true
      api_ref:
        description: te-tengo-general-api branch, tag or commit the test image is built from
        type: string
        default: develop
  workflow_dispatch:
    inputs:
      api_ref:
        description: te-tengo-general-api branch, tag or commit the test image is built from
        type: string
        default: develop

permissions: {}

defaults:
  run:
    shell: bash

env:
  ANSIBLE_CORE_VERSION: 2.21.5
  ANSIBLE_LINT_VERSION: 26.9.0
  YAMLLINT_VERSION: 1.38.0
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Ansible, ansible-lint and yamllint
        run: |
          pipx install "ansible-core==$ANSIBLE_CORE_VERSION"
          pipx install "ansible-lint==$ANSIBLE_LINT_VERSION"
          pipx inject ansible-lint "ansible-core==$ANSIBLE_CORE_VERSION"
          pipx install "yamllint==$YAMLLINT_VERSION"
          make galaxy

      - name: yamllint
        run: make yamllint

      - name: ansible-lint (production profile)
        run: make ansible-lint

      - name: Syntax check of the playbook
        working-directory: ansible
        run: ansible-playbook site.yml --syntax-check -i inventory/hosts.yml.example -e @prod.yml

      - name: docker compose config
        run: make compose-config

  deploy-test:
    name: Deploy to a containerized host
    needs: lint
    # null outside workflow_call: only an explicit false skips it.
    if: format('{0}', inputs.deploy-test) != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TT_API_SRC: ${{ github.workspace }}/te-tengo-general-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # te-tengo-general-api is public: the workflow token reads it, no extra secret.
      - name: Check out te-tengo-general-api
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Te-Tengo-Tech/te-tengo-general-api
          ref: ${{ inputs.api_ref || 'develop' }}
          path: te-tengo-general-api
          persist-credentials: false

      - name: Install Ansible
        run: |
          pipx install "ansible-core==$ANSIBLE_CORE_VERSION"
          make galaxy

      - name: Start the test host and Floci
        run: make test-host-up

      - name: Deploy with site.yml
        run: make test-deploy

      - name: Smoke test
        run: make test-smoke | tee smoke.txt

      - name: The api container runs the configured image
        run: make test-running-image

      - name: Summary
        if: always()
        run: |
          {
            echo "### Containerized deploy test"
            echo '```'
            sed -n '/== Summary/,$p' smoke.txt 2>/dev/null || echo "No smoke test output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs of the stack on failure
        if: failure()
        run: docker exec -w /opt/te-tengo tt-test-host docker compose logs --tail 200 || true

      - name: Tear down
        if: always()
        run: make test-down
