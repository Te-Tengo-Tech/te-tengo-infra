name: PR title

# Required check `pr-title`: the pull request title is a Conventional Commit, because a squash merge makes
# it the commit on develop (and the CHANGELOG is written from those commits). Release and back-merge pull
# requests use `release: x.y.z` and `chore: ...`. Same workflow in every Te Tengo repository.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|release'
          if [[ "$TITLE" =~ ^($types)(\([a-z0-9][a-z0-9._/-]*\))?!?:\ [^[:space:]].*$ ]]; then
            echo "Conventional title: $TITLE"
            exit 0
          fi
          echo "::error title=Not a Conventional Commits title::'$TITLE' must look like 'type(scope): summary'" \
            "(scope optional, '!' for a breaking change), with type one of ${types//|/, }." \
            "Example: 'fix(ci): keep signing keys out of pull request builds'."
          exit 1
