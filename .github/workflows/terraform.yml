name: Terraform

# The Terraform part of CI (ci.yml calls it). Static checks of every configuration (envs/azure, envs/oci, envs/mvp, envs/local, bootstrap and the
# modules) and an apply/destroy round trip of the AWS module against the Floci emulator. No cloud
# credentials exist here: `terraform init -backend=false`, the Azure and OCI modules are tested with
# mocked providers, and nothing is ever planned or applied against Azure, Oracle Cloud or AWS (the
# Makefile's apply targets refuse to run in CI).

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

env:
  TF_VERSION: 1.16.3
  TF_IN_AUTOMATION: "1"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  static:
    name: fmt, validate, test, tflint, checkov
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Create the provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: terraform fmt
        run: make fmt-check

      - name: terraform validate (every env and module, -backend=false)
        run: make validate

      - name: terraform test (Azure and OCI modules, mocked providers)
        run: make tf-test

      - name: tflint (terraform, aws and azurerm rulesets)
        run: make lint

      - name: checkov
        run: make security

  floci:
    name: Apply and destroy against Floci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      floci:
        image: floci/floci:2.2.0
        ports:
          - 4566:4566
        env:
          FLOCI_SERVICES_ECS_RECONCILE_CONTAINERS_ON_STARTUP: "false"
    env:
      FLOCI_ENDPOINT: http://localhost:4566
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Create the provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Wait for Floci
        run: |
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null "$FLOCI_ENDPOINT/_localstack/health" && exit 0
            sleep 1
          done
          echo "::error::Floci did not become healthy"
          exit 1

      - name: Apply envs/local
        run: make local-apply FLOCI_ENDPOINT="$FLOCI_ENDPOINT"

      - name: Check the rendered Ansible inventory
        run: |
          terraform -chdir=envs/local output -raw ansible_inventory > "$RUNNER_TEMP/hosts.yml"
          python3 - "$RUNNER_TEMP/hosts.yml" <<'EOF'
          import sys, yaml
          inventory = yaml.safe_load(open(sys.argv[1]))
          hosts = inventory["all"]["children"]["te_tengo"]["hosts"]
          (name, host), = hosts.items()
          required = ["ansible_host", "ansible_user", "ansible_connection", "app_hostname", "aws_region",
                      "cloud_provider", "memory_profile", "instance_architecture", "object_storage_region",
                      "object_storage_auth", "clips_s3_bucket", "backup_s3_bucket", "ses_sender",
                      "push_provider", "live_view_publish_port", "live_view_webrtc_port"]
          missing = [key for key in required if host.get(key) in (None, "")]
          if missing:
              sys.exit(f"{name}: missing {missing}")
          print(f"{name}: {len(host)} variables, memory_profile={host['memory_profile']}")
          EOF
          {
            echo "### Inventory rendered from Floci"
            echo '```yaml'
            cat "$RUNNER_TEMP/hosts.yml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy envs/local
        if: always()
        run: make local-destroy FLOCI_ENDPOINT="$FLOCI_ENDPOINT"

      # The envs/mvp defaults: only the VM (storage in R2, e-mail by SMTP, DNS at the registrar).
      - name: Apply and destroy envs/local as "VM only"
        env:
          VM_ONLY: -var enable_s3_buckets=false -var enable_ses=false -var enable_sns=false -var enable_route53=false
        run: |
          make local-apply FLOCI_ENDPOINT="$FLOCI_ENDPOINT" LOCAL_TF_ARGS="$VM_ONLY"
          terraform -chdir=envs/local output -raw ansible_inventory | python3 -c '
          import sys, yaml
          (host,) = yaml.safe_load(sys.stdin)["all"]["children"]["te_tengo"]["hosts"].values()
          assert host["object_storage_auth"] == "static" and host["object_storage_endpoint"], host
          assert host["ses_sender"] == "" and host["push_provider"] == "fcm", host
          print("VM-only inventory:", host["object_storage_endpoint"], host["clips_s3_bucket"])'
          make local-destroy FLOCI_ENDPOINT="$FLOCI_ENDPOINT" LOCAL_TF_ARGS="$VM_ONLY"
