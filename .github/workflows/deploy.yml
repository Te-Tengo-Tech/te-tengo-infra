name: Deploy
run-name: >-
  ${{ github.event_name == 'repository_dispatch'
  && format('Deploy API {0} ({1}) to produccion', github.event.client_payload.tag, github.event.client_payload.version || 'no version')
  || format('Deploy API {0} to {1}', inputs.api_tag || 'current', inputs.target) }}

# Production deploy of the app role (Ansible over SSH; no Terraform runs here). Runbook: docs/deploy.md.
# Every production run waits for a required reviewer on the GitHub environment `produccion` before the
# job starts, so nothing touches the VM without approval. There are no deploys on a push to main: releases
# are promoted from their release branch, and main is merged last.
# - repository_dispatch `desplegar-api`: sent by the produccion stage of te-tengo-general-api's Release
#   workflow (release.yml, on its release/* or hotfix/* branch) after the image passed its staging;
#   client_payload {tag: sha-<short commit>, digest: sha256:..., ref: <commit>, version: x.y.z}. Deploys that
#   tag to production (Azure) after checking that it still resolves to the digest.
# - workflow_call: the produccion stage of this repository's Release workflow (release.yml) redeploys the
#   configuration of an infra release with the image the host already runs (api_tag empty = current).
# - workflow_dispatch: any tag (empty = current), any target, optional check mode.
# Targets: azure (production, environment `produccion`: plain SSH with a dedicated deploy key and a pinned
# host key, the committed ansible/prod.yml); oci (inactive alternative, environment `oci`, same SSH path,
# without prod.yml); aws (inactive alternative, environment `mvp`: GitHub OIDC -> AWS role -> SSH over SSM).
# Inert until the environment is configured: without its variables and secrets the job ends with a notice.
# Switch (organization variable, Te-Tengo-Tech → Settings → Secrets and variables → Actions → Variables;
# explicit opt-in, unset means off): ENABLE_API_DEPLOY 'true' lets the deploy jobs run, for every trigger
# and target. Any other value freezes production: the deploy job is skipped and the plan job's summary
# says why. te-tengo-general-api gates its desplegar-api dispatch with the same variable.

on:
  repository_dispatch:
    types: [desplegar-api]
  workflow_call:
    inputs:
      target:
        description: Where to deploy (azure is production)
        type: string
        default: azure
      api_tag:
        description: Tag of ghcr.io/te-tengo-tech/te-tengo-general-api; empty keeps the deployed one
        type: string
        default: ""
      check_only:
        description: Run Ansible in check mode (no change on the host)
        type: boolean
        default: false
      reason:
        description: Why this deploy runs (shown in the summary)
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy (azure is production; oci and aws are inactive alternatives)
        type: choice
        options: [azure, oci, aws]
        default: azure
      api_tag:
        description: Tag of ghcr.io/te-tengo-tech/te-tengo-general-api (sha-<short commit> or a release); empty keeps the deployed one
        type: string
        required: false
        default: ""
      check_only:
        description: Run Ansible in check mode (no change on the host)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ANSIBLE_CORE_VERSION: 2.21.5
  ANSIBLE_FORCE_COLOR: "1"
  API_IMAGE: ghcr.io/te-tengo-tech/te-tengo-general-api

jobs:
  plan:
    name: Resolve the deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      environment: ${{ steps.resolve.outputs.environment }}
      api_tag: ${{ steps.resolve.outputs.api_tag }}
      api_digest: ${{ steps.resolve.outputs.api_digest }}
      check_only: ${{ steps.resolve.outputs.check_only }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - name: Target, image tag and reason
        id: resolve
        env:
          ENABLE_API_DEPLOY: ${{ vars.ENABLE_API_DEPLOY }}
          EVENT: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_TAG: ${{ inputs.api_tag }}
          INPUT_CHECK_ONLY: ${{ inputs.check_only }}
          INPUT_REASON: ${{ inputs.reason }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          PAYLOAD_DIGEST: ${{ github.event.client_payload.digest }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          digest=""
          if [ "$EVENT" = repository_dispatch ]; then
            target=azure; tag="$PAYLOAD_TAG"; check_only=false; digest="$PAYLOAD_DIGEST"
            if [[ ! "$PAYLOAD_REF" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error::client_payload.ref must be a commit SHA of te-tengo-general-api"
              exit 1
            fi
            if [ -n "$digest" ] && [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::client_payload.digest must be sha256:<64 hex digits>"
              exit 1
            fi
            if [ -n "$PAYLOAD_VERSION" ] && [[ ! "$PAYLOAD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::client_payload.version must be x.y.z"
              exit 1
            fi
            commit_url="https://github.com/Te-Tengo-Tech/te-tengo-general-api/commit/$PAYLOAD_REF"
            reason="te-tengo-general-api ${PAYLOAD_VERSION:+release $PAYLOAD_VERSION, }commit $PAYLOAD_REF ($commit_url)"
          elif [ -n "$INPUT_TARGET" ]; then
            # workflow_dispatch, or workflow_call from release.yml (whose event is the caller's push).
            target="$INPUT_TARGET"; tag="${INPUT_TAG:-current}"; check_only="$INPUT_CHECK_ONLY"
            reason="${INPUT_REASON:-manual run by $GITHUB_ACTOR}"
          else
            echo "::error::Unexpected event $EVENT without inputs"
            exit 1
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image tag: $tag"
            exit 1
          fi
          # The release staged this digest: refuse to deploy if the tag was moved since. The check reads the
          # registry anonymously, so it needs the public package; otherwise it only warns.
          if [ -n "$digest" ]; then
            if resolved=$(docker buildx imagetools inspect "$API_IMAGE:$tag" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest'); then
              if [ "$resolved" != "$digest" ]; then
                echo "::error::$API_IMAGE:$tag resolves to $resolved, not to the staged digest $digest"
                exit 1
              fi
              echo "$API_IMAGE:$tag resolves to the staged digest $digest"
            else
              echo "::warning::Could not read $API_IMAGE:$tag from the registry (is the package public?); its digest was not checked."
            fi
          fi
          case "$target" in
            azure) environment=produccion ;;
            oci) environment=oci ;;
            aws) environment=mvp ;;
            *) echo "::error::Unknown target $target"; exit 1 ;;
          esac
          {
            echo "target=$target"
            echo "environment=$environment"
            echo "api_tag=$tag"
            echo "api_digest=$digest"
            echo "check_only=$check_only"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy"
            echo "| Target | Environment | API image tag | Digest | Check only | Why |"
            echo "|---|---|---|---|---|---|"
            echo "| $target | \`$environment\` | \`$tag\`$([ "$tag" = current ] && echo ' (the one the host runs)') | ${digest:+\`$digest\`} | $check_only | $reason |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ENABLE_API_DEPLOY" != true ]; then
            echo "::notice title=Deploy switched off::The organization variable ENABLE_API_DEPLOY is not 'true'," \
              "so the deploy job is skipped and nothing touches the host."
            {
              echo ""
              echo "**Deploy switched off:** the organization variable \`ENABLE_API_DEPLOY\` is not \`true\`, so the deploy job is skipped and nothing touches the host."
              echo "To deploy, set it to \`true\` (Te-Tengo-Tech → Settings → Secrets and variables → Actions → Variables)" \
                "and run this workflow by hand with the tag above."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-ssh:
    name: Deploy the app role (${{ needs.plan.outputs.target }}, SSH)
    needs: plan
    # Switch: ENABLE_API_DEPLOY (organization variable) must be 'true'.
    if: needs.plan.outputs.target != 'aws' && vars.ENABLE_API_DEPLOY == 'true'
    # Port 22 only accepts admin_cidrs (Terraform). On Azure that is anywhere by default, so a GitHub-hosted
    # runner works. With a narrowed admin_cidrs (always on OCI), set the variable DEPLOY_RUNNER to the label
    # of a self-hosted runner inside admin_cidrs, or see docs/deploy.md for the alternatives.
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 40
    # Required reviewers of `produccion` approve here, before any step runs. Branch policy: release/*,
    # hotfix/* and main.
    environment:
      name: ${{ needs.plan.outputs.environment }}
      url: ${{ needs.plan.outputs.target == 'azure' && 'https://api.tetengo.reqsai.tech' || vars.APP_URL }}
    # One deploy at a time per environment; a running deploy is never cancelled (a newer pending run
    # replaces an older pending one, see docs/deploy.md).
    concurrency:
      group: deploy-${{ needs.plan.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      TARGET: ${{ needs.plan.outputs.target }}
      ENVIRONMENT: ${{ needs.plan.outputs.environment }}
      API_TAG: ${{ needs.plan.outputs.api_tag }}
      CHECK_ONLY: ${{ needs.plan.outputs.check_only }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Check variables and secrets of the environment
        id: check
        env:
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          ANSIBLE_INVENTORY: ${{ vars.ANSIBLE_INVENTORY }}
          HAS_VAULT: ${{ secrets.ANSIBLE_VAULT_B64 != '' }}
          HAS_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD != '' }}
          HAS_SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY != '' }}
        run: |
          missing=()
          for name in SSH_KNOWN_HOSTS ANSIBLE_INVENTORY APP_URL; do
            [ -n "${!name}" ] || missing+=("variable $name")
          done
          [ "$HAS_VAULT" = true ] || missing+=("secret ANSIBLE_VAULT_B64")
          [ "$HAS_VAULT_PASSWORD" = true ] || missing+=("secret ANSIBLE_VAULT_PASSWORD")
          [ "$HAS_SSH_KEY" = true ] || missing+=("secret DEPLOY_SSH_PRIVATE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice title=Deploy skipped::The $ENVIRONMENT environment is not configured yet (missing: ${missing[*]}). See docs/deploy.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.check.outputs.ready == 'true'
        with:
          persist-credentials: false

      - name: Install Ansible
        if: steps.check.outputs.ready == 'true'
        run: |
          pipx install "ansible-core==$ANSIBLE_CORE_VERSION"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write the deploy credentials
        if: steps.check.outputs.ready == 'true'
        env:
          ANSIBLE_INVENTORY: ${{ vars.ANSIBLE_INVENTORY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          ANSIBLE_VAULT_B64: ${{ secrets.ANSIBLE_VAULT_B64 }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/deploy"
          mkdir -p "$dir"
          # Inventory: `terraform -chdir=envs/azure output -raw ansible_inventory` (no secrets in it).
          printf '%s\n' "$ANSIBLE_INVENTORY" > "$dir/hosts.yml"
          # Host key of the VM, pinned: `<public ip> ssh-ed25519 AAAA...` (docs/deploy.md).
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$dir/known_hosts"
          printf '%s' "$ANSIBLE_VAULT_B64" | base64 --decode > "$dir/vault.yml"
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "$dir/vault-pass"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$dir/id_deploy"
          echo "DEPLOY_DIR=$dir" >> "$GITHUB_ENV"

      - name: Run the app role
        if: steps.check.outputs.ready == 'true'
        working-directory: ansible
        run: |
          # Replaces ansible.cfg's ssh_args: an unknown or changed host key stops the deploy
          # (StrictHostKeyChecking=yes) instead of being accepted (accept-new).
          ANSIBLE_SSH_ARGS="-o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o IdentitiesOnly=yes"
          export ANSIBLE_SSH_ARGS="$ANSIBLE_SSH_ARGS -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$DEPLOY_DIR/known_hosts"
          args=()
          [ "$CHECK_ONLY" = true ] && args+=(--check --diff)
          # Production: the committed, non-secret settings (CORS, PWA, HLS origins, ACME e-mail, push, the
          # deploy key), the same file the operator's `make deploy` passes.
          [ "$TARGET" = azure ] && args+=(--extra-vars @prod.yml)
          ansible-playbook site.yml --tags app "${args[@]}" \
            --inventory "$DEPLOY_DIR/hosts.yml" \
            --vault-password-file "$DEPLOY_DIR/vault-pass" \
            --extra-vars "@$DEPLOY_DIR/vault.yml" \
            --extra-vars "ansible_ssh_private_key_file=$DEPLOY_DIR/id_deploy" \
            --extra-vars "te_tengo_api_source=registry te_tengo_registry_auth=none te_tengo_api_tag=$API_TAG"

      - name: Check the public health endpoint
        if: steps.check.outputs.ready == 'true' && env.CHECK_ONLY != 'true'
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -fsS --max-time 10 "$APP_URL/actuator/health" | jq -r '.status' || true)
            if [ "$status" = "UP" ]; then
              image="te-tengo-general-api:$API_TAG"
              [ "$API_TAG" = current ] && image="the te-tengo-general-api image the host already ran"
              echo "$APP_URL/actuator/health is UP with $image" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: status '${status:-none}'"
            sleep 10
          done
          echo "::error::$APP_URL/actuator/health did not report UP"
          exit 1

      - name: Remove the deploy credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy"

  deploy-aws:
    name: Deploy the app role (AWS, SSH over SSM)
    needs: plan
    # Switch: ENABLE_API_DEPLOY (organization variable) must be 'true'.
    if: needs.plan.outputs.target == 'aws' && vars.ENABLE_API_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: mvp
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-mvp
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      SSM_PLUGIN_VERSION: 1.2.835.0
      SSM_PLUGIN_SHA256: 7c6dcad12518571cc7959a713e6a8ae1bdf6ed66fd9bee37dc189e39ca58ae03
      API_TAG: ${{ needs.plan.outputs.api_tag }}
      CHECK_ONLY: ${{ needs.plan.outputs.check_only }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Check variables and secrets of the environment
        id: check
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ANSIBLE_INVENTORY: ${{ vars.ANSIBLE_INVENTORY }}
          HAS_VAULT: ${{ secrets.ANSIBLE_VAULT_B64 != '' }}
          HAS_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD != '' }}
          HAS_SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY != '' }}
        run: |
          missing=()
          for name in AWS_DEPLOY_ROLE_ARN AWS_REGION EC2_INSTANCE_ID APP_URL ANSIBLE_INVENTORY; do
            [ -n "${!name}" ] || missing+=("variable $name")
          done
          [ "$HAS_VAULT" = true ] || missing+=("secret ANSIBLE_VAULT_B64")
          [ "$HAS_VAULT_PASSWORD" = true ] || missing+=("secret ANSIBLE_VAULT_PASSWORD")
          [ "$HAS_SSH_KEY" = true ] || missing+=("secret DEPLOY_SSH_PRIVATE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice title=Deploy skipped::The mvp environment is not configured yet (missing: ${missing[*]}). See docs/deploy.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.check.outputs.ready == 'true'
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        if: steps.check.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          # The deploy role may only terminate sessions with this prefix (Terraform, github-deploy.tf).
          role-session-name: te-tengo-mvp-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install the Session Manager plugin
        if: steps.check.outputs.ready == 'true'
        run: |
          deb="$RUNNER_TEMP/session-manager-plugin.deb"
          curl -fsSL -o "$deb" \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/$SSM_PLUGIN_VERSION/ubuntu_64bit/session-manager-plugin.deb"
          echo "$SSM_PLUGIN_SHA256  $deb" | sha256sum --check --strict
          sudo dpkg -i "$deb"
          session-manager-plugin --version

      - name: Install Ansible
        if: steps.check.outputs.ready == 'true'
        run: |
          pipx install "ansible-core==$ANSIBLE_CORE_VERSION"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write the deploy credentials
        if: steps.check.outputs.ready == 'true'
        env:
          ANSIBLE_INVENTORY: ${{ vars.ANSIBLE_INVENTORY }}
          ANSIBLE_VAULT_B64: ${{ secrets.ANSIBLE_VAULT_B64 }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/deploy"
          mkdir -p "$dir"
          # Inventory: `terraform -chdir=envs/mvp output -raw ansible_inventory` (no secrets in it).
          printf '%s\n' "$ANSIBLE_INVENTORY" > "$dir/hosts.yml"
          printf '%s' "$ANSIBLE_VAULT_B64" | base64 --decode > "$dir/vault.yml"
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "$dir/vault-pass"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$dir/id_deploy"
          echo "DEPLOY_DIR=$dir" >> "$GITHUB_ENV"

      - name: Run the app role
        if: steps.check.outputs.ready == 'true'
        working-directory: ansible
        run: |
          args=()
          [ "$CHECK_ONLY" = true ] && args+=(--check --diff)
          ansible-playbook site.yml --tags app "${args[@]}" \
            --inventory "$DEPLOY_DIR/hosts.yml" \
            --vault-password-file "$DEPLOY_DIR/vault-pass" \
            --extra-vars "@$DEPLOY_DIR/vault.yml" \
            --extra-vars "ansible_ssh_private_key_file=$DEPLOY_DIR/id_deploy" \
            --extra-vars "te_tengo_api_source=registry te_tengo_api_tag=$API_TAG"

      - name: Check the public health endpoint
        if: steps.check.outputs.ready == 'true' && env.CHECK_ONLY != 'true'
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -fsS --max-time 10 "$APP_URL/actuator/health" | jq -r '.status' || true)
            if [ "$status" = "UP" ]; then
              image="te-tengo-general-api:$API_TAG"
              [ "$API_TAG" = current ] && image="the te-tengo-general-api image the host already ran"
              echo "$APP_URL/actuator/health is UP with $image" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: status '${status:-none}'"
            sleep 10
          done
          echo "::error::$APP_URL/actuator/health did not report UP"
          exit 1

      - name: Remove the deploy credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy"
