name: Deploy
# The run name of a dispatched deploy ends with "[<client_payload.request>]": te-tengo-general-api finds and
# polls its run by that name (its .github/scripts/request-deploy.sh). Keep it.
run-name: >-
  ${{ github.event_name == 'repository_dispatch'
  && format('Deploy API {0} ({1}) to produccion [{2}]', github.event.client_payload.version || 'no version',
  github.event.client_payload.tag || github.event.client_payload.digest, github.event.client_payload.request || 'no request')
  || format('Deploy {0} with API {1}{2}', inputs.roles == 'all' && 'every role' || 'the app role',
  inputs.api_digest || inputs.api_tag || 'current', inputs.config_ref && format(' (configuration {0})', inputs.config_ref) || '') }}

# Production deploy to the Azure VM (Ansible over SSH; no Terraform runs here). Runbook: docs/deploy.md.
# Every run waits for a required reviewer on the GitHub environment `produccion` before the deploy job starts,
# so nothing touches the VM without approval. The app role pins the API image by digest and, when the image
# differs from the one running, dumps the database first (te-tengo-backup.service).
# - repository_dispatch `desplegar-api`: sent (as the GitHub App te-tengo-release-bot) by te-tengo-general-api
#   after the merge of a release to its main (produccion.yml, the verified candidate) or by its rollback.yml
#   (an earlier release); client_payload {digest: sha256:..., tag: x.y.z-rc.N or x.y.z, version: x.y.z,
#   ref: <commit>, kind: release|rollback, request: "api <run id>.<attempt>"}. Deploys repository:tag@digest
#   with the app role only (an image change: fast); the API workflow waits for this run's result before it
#   tags the release.
# - workflow_call: this repository's produccion.yml (push to main) and rollback.yml deploy the configuration of
#   an infra release (rollback: of an earlier tag, config_ref) with the image the host already runs (api_tag
#   empty = current) and EVERY role (roles: all = base, docker, app, backup; all idempotent), so a change to
#   the base role (zswap, masked services, firewall, swap) reaches the VM with its release, as the release
#   verification ran the whole site.yml too.
# - workflow_dispatch: any tag and/or digest (both empty = current), roles app or all, optional check mode.
#
# One deploy at a time: the deploy job's first step (.github/scripts/deploy-lock.sh) waits while another
# production deploy is running. It is a step, not a `concurrency` group, on purpose: a job holds its group
# while it waits for its approval, so an API deploy dispatched behind an infra release nobody had approved yet
# used to queue behind it (and a third request cancelled the waiting one). Now waiting for a reviewer blocks
# nobody, and nothing is cancelled.
#
# After the playbook: GET /actuator/health must be UP, and .github/scripts/check-deployed-image.sh checks on
# the VM that the running API container is the configured image and, for an image deploy, that it is the
# requested digest. Any mismatch fails the run, so te-tengo-general-api does not tag a release that is not
# running.
#
# Switch (organization variable, Te-Tengo-Tech → Settings → Secrets and variables → Actions → Variables;
# explicit opt-in, unset means off): ENABLE_API_DEPLOY 'true' lets the deploy job run, for every trigger.
# Any other value freezes production: the deploy job is skipped and the plan job's summary says why.
# te-tengo-general-api gates its desplegar-api dispatch with the same variable.

on:
  repository_dispatch:
    types: [desplegar-api]
  workflow_call:
    inputs:
      api_tag:
        description: Tag of ghcr.io/te-tengo-tech/te-tengo-general-api; empty keeps the deployed one
        type: string
        default: ""
      api_digest:
        description: Digest (sha256:...) that pins the image; empty pulls the tag
        type: string
        default: ""
      config_ref:
        description: Commit or tag of this repository whose Ansible and Compose files are deployed; empty = the run's commit
        type: string
        default: ""
      roles:
        description: app (the app role only) or all (base, docker, app and backup)
        type: string
        default: app
      superseded_ref:
        description: Branch that must still point at the run's commit when the deploy starts (empty = no check)
        type: string
        default: ""
      check_only:
        description: Run Ansible in check mode (no change on the host)
        type: boolean
        default: false
      reason:
        description: Why this deploy runs (shown in the summary)
        type: string
        default: ""
    outputs:
      deployed:
        description: "`true` when the playbook ran and the checks passed (not in check mode, not superseded)"
        value: ${{ jobs.deploy.outputs.deployed }}
  workflow_dispatch:
    inputs:
      api_tag:
        description: Tag of ghcr.io/te-tengo-tech/te-tengo-general-api (x.y.z, x.y.z-rc.N or sha-<short commit>); empty keeps the deployed one
        type: string
        required: false
        default: ""
      api_digest:
        description: Digest (sha256:...) that pins the image, e.g. from the notes of the API release; empty pulls the tag
        type: string
        required: false
        default: ""
      roles:
        description: app (the app role only) or all (base, docker, app and backup)
        type: choice
        options: [app, all]
        default: app
      check_only:
        description: Run Ansible in check mode (no change on the host)
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  ANSIBLE_CORE_VERSION: 2.21.5
  ANSIBLE_FORCE_COLOR: "1"
  API_IMAGE: ghcr.io/te-tengo-tech/te-tengo-general-api

jobs:
  plan:
    name: Resolve the deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      api_tag: ${{ steps.resolve.outputs.api_tag }}
      api_digest: ${{ steps.resolve.outputs.api_digest }}
      config_ref: ${{ steps.resolve.outputs.config_ref }}
      roles: ${{ steps.resolve.outputs.roles }}
      check_only: ${{ steps.resolve.outputs.check_only }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - name: Image, roles and reason
        id: resolve
        env:
          ENABLE_API_DEPLOY: ${{ vars.ENABLE_API_DEPLOY }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.api_tag }}
          INPUT_DIGEST: ${{ inputs.api_digest }}
          INPUT_CONFIG_REF: ${{ inputs.config_ref }}
          INPUT_ROLES: ${{ inputs.roles }}
          INPUT_CHECK_ONLY: ${{ inputs.check_only }}
          INPUT_REASON: ${{ inputs.reason }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          PAYLOAD_DIGEST: ${{ github.event.client_payload.digest }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_KIND: ${{ github.event.client_payload.kind }}
          PAYLOAD_REQUEST: ${{ github.event.client_payload.request }}
        run: |
          digest="" config_ref=""
          if [ "$EVENT" = repository_dispatch ]; then
            tag="${PAYLOAD_TAG:-current}"; check_only=false; digest="$PAYLOAD_DIGEST"; roles=app
            if [[ ! "$PAYLOAD_REF" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error::client_payload.ref must be a commit SHA of te-tengo-general-api"
              exit 1
            fi
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::client_payload.digest must be sha256:<64 hex digits>: an API deploy is pinned by digest"
              exit 1
            fi
            if [ -n "$PAYLOAD_VERSION" ] && [[ ! "$PAYLOAD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::client_payload.version must be x.y.z"
              exit 1
            fi
            if [ -n "$PAYLOAD_REQUEST" ] && [[ ! "$PAYLOAD_REQUEST" =~ ^api\ [0-9]+\.[0-9]+$ ]]; then
              echo "::error::client_payload.request must be 'api <run id>.<attempt>'"
              exit 1
            fi
            case "${PAYLOAD_KIND:-release}" in
              release) what="release $PAYLOAD_VERSION" ;;
              rollback) what="rollback to $PAYLOAD_VERSION" ;;
              *) echo "::error::client_payload.kind must be release or rollback"; exit 1 ;;
            esac
            commit_url="https://github.com/Te-Tengo-Tech/te-tengo-general-api/commit/$PAYLOAD_REF"
            reason="te-tengo-general-api $what, commit $PAYLOAD_REF ($commit_url)${PAYLOAD_REQUEST:+, request $PAYLOAD_REQUEST}"
          elif [ -n "$INPUT_ROLES" ]; then
            # workflow_dispatch, or workflow_call from produccion.yml or rollback.yml (whose event is the caller's).
            tag="${INPUT_TAG:-current}"; check_only="$INPUT_CHECK_ONLY"; roles="$INPUT_ROLES"
            digest="$INPUT_DIGEST"; config_ref="$INPUT_CONFIG_REF"
            reason="${INPUT_REASON:-manual run by $GITHUB_ACTOR}"
            if [ -n "$digest" ] && [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::api_digest must be sha256:<64 hex digits>"
              exit 1
            fi
            if [ -n "$config_ref" ] && [[ ! "$config_ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]]; then
              echo "::error::Invalid config_ref: $config_ref"
              exit 1
            fi
          else
            echo "::error::Unexpected event $EVENT without inputs"
            exit 1
          fi
          if [ "$roles" != app ] && [ "$roles" != all ]; then
            echo "::error::roles must be app or all (found '$roles')"
            exit 1
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image tag: $tag"
            exit 1
          fi
          # The image is pinned by digest, so a moved tag cannot change what is deployed. This only checks that
          # the digest exists; the registry is read anonymously (public package), otherwise it only warns.
          if [ -n "$digest" ]; then
            if docker buildx imagetools inspect "$API_IMAGE@$digest" >/dev/null 2>&1; then
              echo "$API_IMAGE@$digest exists"
            else
              echo "::warning::Could not read $API_IMAGE@$digest from the registry (is the package public?); the host's pull decides."
            fi
          fi
          {
            echo "api_tag=$tag"
            echo "api_digest=$digest"
            echo "config_ref=$config_ref"
            echo "roles=$roles"
            echo "check_only=$check_only"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy"
            echo "| Environment | Roles | API image tag | Digest | Configuration | Check only | Why |"
            echo "|---|---|---|---|---|---|---|"
            kept=""
            [ "$tag" = current ] && [ -z "$digest" ] && kept=" (the one the host runs)"
            [ "$roles" = all ] && what_roles="base, docker, app, backup" || what_roles="app"
            echo "| \`produccion\` | $what_roles | \`$tag\`$kept | ${digest:+\`$digest\`} | \`${config_ref:-$GITHUB_SHA}\` | $check_only | $reason |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ENABLE_API_DEPLOY" != true ]; then
            echo "::notice title=Deploy switched off::The organization variable ENABLE_API_DEPLOY is not 'true'," \
              "so the deploy job is skipped and nothing touches the host."
            {
              echo ""
              echo "**Deploy switched off:** the organization variable \`ENABLE_API_DEPLOY\` is not \`true\`, so the deploy job is skipped and nothing touches the host."
              echo "To deploy, set it to \`true\` (Te-Tengo-Tech → Settings → Secrets and variables → Actions → Variables)" \
                "and run this workflow by hand with the tag above."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    # The API's request-deploy.sh reads the conclusion of the job whose name starts with "Deploy the app role";
    # deploy-lock.sh recognises production deploys by "(produccion, SSH)". Keep both.
    name: Deploy ${{ needs.plan.outputs.roles == 'all' && 'every role' || 'the app role' }} (produccion, SSH)
    needs: plan
    # Switch: ENABLE_API_DEPLOY (organization variable) must be 'true'.
    if: vars.ENABLE_API_DEPLOY == 'true'
    # Port 22 only accepts admin_cidrs (Terraform), anywhere by default on Azure, so a GitHub-hosted runner
    # works. With a narrowed admin_cidrs, set the variable DEPLOY_RUNNER to the label of a self-hosted runner
    # inside admin_cidrs, or see docs/deploy.md for the alternatives.
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    # Required reviewers of `produccion` approve here, before any step runs. Branch policy: main only
    # (production comes from main; a dispatched run always runs on main).
    environment:
      name: produccion
      url: https://api.tetengo.reqsai.tech
    permissions:
      contents: read
      actions: read # deploy-lock.sh lists the other deploy jobs
    outputs:
      deployed: ${{ steps.deployed.outputs.deployed }}
    env:
      # The configuration is checked out under config/ (possibly at config_ref); the scripts of this run's
      # commit under workflow-scripts/.
      ANSIBLE_CONFIG: ${{ github.workspace }}/config/ansible/ansible.cfg
      API_TAG: ${{ needs.plan.outputs.api_tag }}
      API_DIGEST: ${{ needs.plan.outputs.api_digest }}
      ROLES: ${{ needs.plan.outputs.roles }}
      CHECK_ONLY: ${{ needs.plan.outputs.check_only }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      # After the approval, never before: see the header. Sparse checkout of this commit's scripts (the
      # configuration itself is checked out below, possibly at config_ref).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: workflow-scripts
          sparse-checkout: .github/scripts
      - name: Wait for any other production deploy
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK_JOB: (produccion, SSH)
          LOCK_STEP: Wait for any other production deploy
        run: workflow-scripts/.github/scripts/deploy-lock.sh

      - name: Superseded?
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          SUPERSEDED_REF: ${{ inputs.superseded_ref }}
        run: |
          if [ -z "$SUPERSEDED_REF" ]; then
            echo "superseded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$SUPERSEDED_REF" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Superseded, not deployed::$SUPERSEDED_REF moved on to ${head:0:12}; this run is for" \
              "${GITHUB_SHA:0:12}. The run of the newer commit deploys instead, so this release is not deployed or tagged."
            echo "- Not deployed: \`$SUPERSEDED_REF\` moved on to \`${head:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check variables and secrets of the environment
        if: steps.head.outputs.superseded != 'true'
        env:
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          ANSIBLE_INVENTORY: ${{ vars.ANSIBLE_INVENTORY }}
          HAS_VAULT: ${{ secrets.ANSIBLE_VAULT_B64 != '' }}
          HAS_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD != '' }}
          HAS_SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY != '' }}
        run: |
          missing=()
          for name in SSH_KNOWN_HOSTS ANSIBLE_INVENTORY APP_URL; do
            [ -n "${!name}" ] || missing+=("variable $name")
          done
          [ "$HAS_VAULT" = true ] || missing+=("secret ANSIBLE_VAULT_B64")
          [ "$HAS_VAULT_PASSWORD" = true ] || missing+=("secret ANSIBLE_VAULT_PASSWORD")
          [ "$HAS_SSH_KEY" = true ] || missing+=("secret DEPLOY_SSH_PRIVATE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            # Production must deploy or fail: te-tengo-general-api tags a release only after a successful deploy.
            echo "::error title=Deploy not configured::The produccion environment lacks ${missing[*]}. See docs/deploy.md."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.head.outputs.superseded != 'true'
        with:
          # rollback.yml deploys the configuration of an earlier tag; otherwise the run's commit.
          ref: ${{ needs.plan.outputs.config_ref }}
          path: config
          persist-credentials: false

      - name: Install Ansible
        if: steps.head.outputs.superseded != 'true'
        working-directory: config
        run: |
          pipx install "ansible-core==$ANSIBLE_CORE_VERSION"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write the deploy credentials
        if: steps.head.outputs.superseded != 'true'
        env:
          ANSIBLE_INVENTORY: ${{ vars.ANSIBLE_INVENTORY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          ANSIBLE_VAULT_B64: ${{ secrets.ANSIBLE_VAULT_B64 }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/deploy"
          mkdir -p "$dir"
          # Inventory: `terraform -chdir=envs/azure output -raw ansible_inventory` (no secrets in it).
          printf '%s\n' "$ANSIBLE_INVENTORY" > "$dir/hosts.yml"
          # Host key of the VM, pinned: `<public ip> ssh-ed25519 AAAA...` (docs/deploy.md).
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$dir/known_hosts"
          printf '%s' "$ANSIBLE_VAULT_B64" | base64 --decode > "$dir/vault.yml"
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "$dir/vault-pass"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$dir/id_deploy"
          echo "DEPLOY_DIR=$dir" >> "$GITHUB_ENV"
          # Replaces ansible.cfg's ssh_args for the playbook and the image check: an unknown or changed host
          # key stops the deploy (StrictHostKeyChecking=yes) instead of being accepted (accept-new).
          ssh_args="-o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o IdentitiesOnly=yes"
          echo "ANSIBLE_SSH_ARGS=$ssh_args -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$dir/known_hosts" >> "$GITHUB_ENV"

      - name: Run the playbook (${{ needs.plan.outputs.roles == 'all' && 'every role' || 'app role' }})
        if: steps.head.outputs.superseded != 'true'
        working-directory: config/ansible
        run: |
          args=()
          [ "$CHECK_ONLY" = true ] && args+=(--check --diff)
          # roles=app: an API image deploy, the app role only. roles=all: an infra release or rollback, the
          # whole site.yml (base, docker, app, backup; every role is idempotent, as the release verification
          # on the containerized host showed).
          [ "$ROLES" = app ] && args+=(--tags app)
          # The committed, non-secret production settings (CORS, PWA, HLS origins, ACME e-mail, push, the
          # deploy key), the same file the operator's `make deploy` passes.
          # The app role pins the image (repository:tag@digest) and, if it differs from the running one, runs
          # te-tengo-backup.service first (roles/app/tasks/backup-before-image-change.yml).
          ansible-playbook site.yml "${args[@]}" \
            --extra-vars @prod.yml \
            --inventory "$DEPLOY_DIR/hosts.yml" \
            --vault-password-file "$DEPLOY_DIR/vault-pass" \
            --extra-vars "@$DEPLOY_DIR/vault.yml" \
            --extra-vars "ansible_ssh_private_key_file=$DEPLOY_DIR/id_deploy" \
            --extra-vars "te_tengo_api_source=registry te_tengo_registry_auth=none te_tengo_api_tag=$API_TAG te_tengo_api_digest=$API_DIGEST"

      - name: Check the public health endpoint
        if: steps.head.outputs.superseded != 'true' && env.CHECK_ONLY != 'true'
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -fsS --max-time 10 "$APP_URL/actuator/health" | jq -r '.status' || true)
            if [ "$status" = "UP" ]; then
              echo "$APP_URL/actuator/health is UP" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: status '${status:-none}'"
            sleep 10
          done
          echo "::error::$APP_URL/actuator/health did not report UP"
          exit 1

      # The health endpoint cannot tell which image answers. This reads it on the VM: the running API
      # container must be the configured image and, for an image deploy, the requested digest.
      - name: Check the running API image
        if: steps.head.outputs.superseded != 'true' && env.CHECK_ONLY != 'true'
        working-directory: config/ansible
        run: |
          ../../workflow-scripts/.github/scripts/check-deployed-image.sh "$API_DIGEST" \
            --inventory "$DEPLOY_DIR/hosts.yml" \
            --extra-vars "ansible_ssh_private_key_file=$DEPLOY_DIR/id_deploy"

      - name: Deployed
        id: deployed
        if: steps.head.outputs.superseded != 'true' && env.CHECK_ONLY != 'true'
        run: echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Remove the deploy credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy"
