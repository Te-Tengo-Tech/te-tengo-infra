name: Release
run-name: Release ${{ github.ref_name }}

# Release candidates of this repository's own changes (Ansible, Compose): docs/deploy.md, "Release flow".
# A push to release/x.y.z or hotfix/x.y.z:
#   1. version       VERSION must match the branch and must not be released yet. No environment.
#   2. ci            calls ci.yml on the release commit (the Ansible static checks and the whole Terraform part;
#                    the containerized deploy is the next job): the commit is checked once, here; the pull
#                    request into main does not check it again.
#   3. verify        automatic verification, no environment and no approval (there is no staging target: no
#                    second VM). The local container harness (make test-all) deploys the release commit with
#                    the WHOLE site.yml (what production runs for an infra release) to a containerized Ubuntu
#                    24.04 host capped like the Azure VM, smoke-tests it through Caddy, checks its memory budget
#                    and that the api container runs the configured image. The API on that host is the image in
#                    production: the digest of GHCR `latest` (te-tengo-general-api moves `latest` only after a
#                    successful production deploy or rollback). Only when no `latest` can be read is it built
#                    from te-tengo-general-api's develop. Never from the API's main.
#   4. candidate     records the verified commit as the GitHub pre-release vX.Y.Z-rc.N (N = 1 + the highest
#                    existing one): commit, git tree hash, the API image it was verified with.
#   5. pull-request  opens (or updates) the pull request release/x.y.z → main, titled `release: x.y.z`, as the
#                    GitHub App te-tengo-release-bot (so its checks run; the edit re-runs release-gate).
# Nothing is deployed here. After the merge, produccion.yml on main finds the candidate whose tree hash equals
# main's, deploys it to production (approval on `produccion`) and only then tags vX.Y.Z.
on:
  push:
    branches:
      - "release/**"
      - "hotfix/**"

permissions: {}

# One release run per branch at a time. A running pipeline is never cancelled (it may be deploying); a newer
# push waits, and replaces an older run that has not started yet.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  ANSIBLE_CORE_VERSION: 2.21.5
  ANSIBLE_LINT_VERSION: 26.9.0
  YAMLLINT_VERSION: 1.38.0
  ANSIBLE_FORCE_COLOR: "1"
  API_IMAGE: ghcr.io/te-tengo-tech/te-tengo-general-api
  # Fallback API for the verification host when no production image can be read.
  API_FALLBACK_REF: develop

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must hold x.y.z (found '$version')"
            exit 1
          fi
          if [ "${GITHUB_REF_NAME#*/}" != "$version" ]; then
            echo "::error title=Branch and version differ::$GITHUB_REF_NAME must release version ${GITHUB_REF_NAME#*/}," \
              "but VERSION says $version. Bump VERSION on the branch or rename the branch."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" > /dev/null 2>&1; then
            echo "::error title=Already released::v$version exists. A change to a released version is a new version (hotfix/x.y.z+1)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "## Release $version ($GITHUB_REF_NAME, \`${GITHUB_SHA::7}\`)"
            echo "Next: CI (Ansible static checks, Terraform) and the verification on the containerized host, then the"
            echo "candidate \`v$version-rc.N\` and the pull request to \`main\`. Production happens after the merge (produccion.yml)."
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      deploy-test: false

  verify:
    name: Verify configuration (containers)
    needs: version
    # Always runs; no environment and no approval.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    outputs:
      api: ${{ steps.api.outputs.api || steps.fallback.outputs.api }}
    env:
      TT_API_SRC: ${{ github.workspace }}/te-tengo-general-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image in production (GHCR latest)
        id: api
        run: |
          if digest=$(docker buildx imagetools inspect "$API_IMAGE:latest" --format '{{json .Manifest}}' 2>"$RUNNER_TEMP/latest.err" | jq -r '.digest') \
            && [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "TT_API_IMAGE_REF=$API_IMAGE@$digest" >> "$GITHUB_ENV"
            echo "api=$API_IMAGE@$digest (latest: the image in production)" >> "$GITHUB_OUTPUT"
            echo "source=production" >> "$GITHUB_OUTPUT"
            echo "The test host runs the API image in production: $API_IMAGE@$digest"
          else
            echo "::warning title=No production API image::Could not read $API_IMAGE:latest ($(tr '\n' ' ' < "$RUNNER_TEMP/latest.err" | head -c 300))." \
              "No API release has been deployed yet, or the package is private: the test host runs te-tengo-general-api $API_FALLBACK_REF instead."
            echo "source=develop" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out te-tengo-general-api (${{ env.API_FALLBACK_REF }}, no production image)
        if: steps.api.outputs.source == 'develop'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Te-Tengo-Tech/te-tengo-general-api
          ref: ${{ env.API_FALLBACK_REF }}
          # The API repository is public: the workflow token reads it.
          path: te-tengo-general-api
          persist-credentials: false
      - name: API commit of the fallback
        id: fallback
        if: steps.api.outputs.source == 'develop'
        run: echo "api=te-tengo-general-api $API_FALLBACK_REF at $(git -C te-tengo-general-api rev-parse HEAD) (built from source)" >> "$GITHUB_OUTPUT"
      - name: Install Ansible
        run: |
          pipx install "ansible-core==$ANSIBLE_CORE_VERSION"
          make galaxy
      - name: Start the test host and Floci
        run: make test-host-up
      - name: Deploy with site.yml
        run: make test-deploy
      - name: Smoke test
        run: make test-smoke | tee smoke.txt
      - name: Memory of the host and the stack
        run: make test-memory | tee memory.txt
      - name: The api container runs the configured image
        run: make test-running-image
      - name: Summary
        if: always()
        env:
          API: ${{ steps.api.outputs.api || steps.fallback.outputs.api }}
        run: |
          {
            echo "## Verification: containerized host"
            echo "Release commit \`${GITHUB_SHA::7}\` deployed with \`site.yml\` to the test host (Ubuntu 24.04, systemd, SSH,"
            echo "1 GiB like the Azure VM). API: $API."
            echo '```'
            sed -n '/== Summary/,$p' smoke.txt 2>/dev/null || echo "No smoke test output"
            echo '```'
            if [ -s memory.txt ]; then
              echo '```'
              cat memory.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs of the stack on failure
        if: failure()
        run: docker exec -w /opt/te-tengo tt-test-host docker compose logs --tail 200 || true
      - name: Tear down
        if: always()
        run: make test-down

  candidate:
    name: Record the candidate (pre-release)
    needs: [version, ci, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # the pre-release vX.Y.Z-rc.N and its tag
    outputs:
      candidate: ${{ steps.create.outputs.candidate }}
      tree: ${{ steps.create.outputs.tree }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      API: ${{ needs.verify.outputs.api }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the pre-release vX.Y.Z-rc.N
        id: create
        # The block at the end is read by produccion.yml: keep its key=value lines.
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          last=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION-rc." --jq '.[].ref' \
            | sed -n "s|^refs/tags/v$VERSION-rc\.\([0-9][0-9]*\)$|\1|p" | sort -n | tail -n 1)
          candidate="$VERSION-rc.$(( ${last:-0} + 1 ))"
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<EOF
          Release candidate **$candidate** of te-tengo-infra (final version **$VERSION**, build $GITHUB_RUN_NUMBER) from \`$GITHUB_REF_NAME\`.
          The candidate is the repository content itself (Ansible, Compose): its identity is the git tree hash.

          | | |
          |---|---|
          | Commit | $GITHUB_SHA |
          | Tree | \`$tree\` |
          | Verification | passed: CI, the whole \`site.yml\` on the containerized host, smoke test, memory budget and running image, [pipeline run]($RUN_URL) |
          | API on the test host | $API |

          Production redeploys this configuration after the pull request to \`main\` is merged, if \`main\` has the same tree.

          \`\`\`text
          candidate=$candidate
          version=$VERSION
          build=$GITHUB_RUN_NUMBER
          commit=$GITHUB_SHA
          tree=$tree
          verification=passed
          \`\`\`
          EOF
          gh release create "v$candidate" -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "v$candidate" --notes-file "$notes"
          {
            echo "candidate=$candidate"
            echo "tree=$tree"
          } >> "$GITHUB_OUTPUT"
          echo "Recorded the verified commit as the pre-release \`v$candidate\` (tree \`$tree\`)." >> "$GITHUB_STEP_SUMMARY"

  pull-request:
    name: Pull request to main
    needs: [version, verify, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CANDIDATE: ${{ needs.candidate.outputs.candidate }}
      TREE: ${{ needs.candidate.outputs.tree }}
      API: ${{ needs.verify.outputs.api }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check the release bot configuration
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error title=Release bot not configured::The organization variable RELEASE_APP_ID and the organization secret" \
              "RELEASE_APP_PRIVATE_KEY (GitHub App te-tengo-release-bot) are required to open the pull request." \
              "Nothing falls back to GITHUB_TOKEN: its pull requests start no workflows."
            exit 1
          fi
      - name: Mint the release bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The App ID; GitHub accepts it as the JWT issuer like the client ID.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/body.md"
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$CANDIDATE"
          cat > "$body" <<EOF
          Release **$VERSION** of te-tengo-infra from \`$GITHUB_REF_NAME\`: candidate [\`$CANDIDATE\`]($release_url).

          | | |
          |---|---|
          | Commit | $GITHUB_SHA |
          | Tree | \`$TREE\` |
          | Checks | CI on this commit: yamllint, ansible-lint, syntax check, \`docker compose config\`, the Terraform checks |
          | Verification | containerized host: the whole \`site.yml\` deployed the release commit; smoke test, memory budget and running image passed |
          | API on the test host | $API |
          | Staging | none: there is no second VM |

          \`release-gate\` checks that merging puts exactly this tree into \`main\` and that this candidate is verified. Merge with a
          merge commit. After the merge, \`produccion.yml\` on \`main\` deploys the whole \`site.yml\` (base, docker, app, backup) of this
          tree to the Azure VM with the API image it already runs (approval on \`produccion\`), and only then tags \`v$VERSION\` and opens
          the back-merge into \`develop\`. A new push to \`$GITHUB_REF_NAME\` records the next candidate and updates this description.

          Pipeline run: $RUN_URL/attempts/$GITHUB_RUN_ATTEMPT
          EOF
          .github/scripts/open-release-pr.sh "release: $VERSION" "$body" \
            "New candidate [\`$CANDIDATE\`]($release_url) (commit \`${GITHUB_SHA:0:12}\`), verified. The description now describes it."
