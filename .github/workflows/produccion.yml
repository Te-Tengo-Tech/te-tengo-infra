name: Produccion
run-name: Produccion (main, ${{ github.sha }})

# Production of this repository's own changes, on a push to main (the merged release or hotfix pull request):
# docs/deploy.md, "Release flow". Nothing is checked or verified again here: release.yml did it on the release
# commit and release-gate proved before the merge that main gets exactly that candidate's tree.
#   1. candidate    finds the verified candidate with .github/scripts/find-candidate.sh (the same command as
#                   release-gate): the newest pre-release vX.Y.Z-rc.N (X.Y.Z = VERSION) whose recorded git tree
#                   hash equals main's and whose verification passed. None → the run fails.
#   2. produccion   calls deploy.yml: the WHOLE site.yml (base, docker, app and backup; roles: all) on the
#                   Azure VM with the API image the host already runs (api_tag empty = current; same image, so
#                   no database backup is needed), exactly what the verification ran on the containerized host.
#                   A change to the base role (zswap, masked services, firewall) therefore reaches the VM with
#                   its release. Its deploy job runs in the environment `produccion` (approval), then takes the
#                   deploy lock, and checks /actuator/health and the running API image. Not deployed if main
#                   moved on meanwhile (the newer run deploys). Switch: ENABLE_API_DEPLOY.
#   3. release      only if the deploy happened: the tag vX.Y.Z on this commit and its GitHub Release (notes: the
#                   CHANGELOG.md section and the candidate). Switched off, failed, rejected or superseded → no tag.
#   4. back-merge   the pull request main → develop as te-tengo-release-bot, with auto-merge (merge commit);
#                   after a hotfix also main → any newer open release/* branch.
# If produccion fails there is no tag: fix it and use "Re-run failed jobs". Rollback: rollback.yml.
on:
  push:
    branches: [main]

permissions: {}

# No workflow-level concurrency group: it would hold the whole run while the deploy job waits for its approval
# and block a rollback (or an API deploy) behind it. deploy.yml's deploy lock serializes the deploys
# themselves, after their approval.

defaults:
  run:
    shell: bash

jobs:
  candidate:
    name: Find the verified candidate of main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.find.outputs.released }}
      tag: ${{ steps.find.outputs.tag }}
      candidate: ${{ steps.find.outputs.candidate }}
      build: ${{ steps.find.outputs.build }}
      commit: ${{ steps.find.outputs.commit }}
      tree: ${{ steps.find.outputs.tree }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            VERSION
            .github/scripts
          sparse-checkout-cone-mode: false
      - name: Version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must hold x.y.z (found '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Candidate whose tree hash equals main's
        id: find
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ENABLE_API_DEPLOY: ${{ vars.ENABLE_API_DEPLOY }}
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          # Already released from this commit (a full re-run of a successful run): nothing left to do.
          if released=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq '.object.sha' 2>/dev/null); then
            if [ "$released" = "$GITHUB_SHA" ]; then
              echo "released=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=Already released::v$VERSION already tags $GITHUB_SHA: nothing to deploy or tag."
              echo "\`v$VERSION\` already tags this commit: nothing to deploy or tag." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error title=Version already released::v$VERSION already exists on another commit ($released)." \
              "A new release needs a new version: release/x.y.z or hotfix/x.y.z with a higher VERSION."
            exit 1
          fi
          echo "released=false" >> "$GITHUB_OUTPUT"
          echo "## Candidate of \`main\` (\`$GITHUB_SHA\`)" >> "$GITHUB_STEP_SUMMARY"
          if ! .github/scripts/find-candidate.sh "$VERSION" "$tree"; then
            echo "::error title=No candidate for main::main differs from the tested candidate; push the change to the" \
              "release branch to build a new rc. No verified pre-release v$VERSION-rc.N has the tree $tree of $GITHUB_SHA."
            exit 1
          fi
          if [ "$ENABLE_API_DEPLOY" != true ]; then
            echo "::notice title=Produccion switched off::ENABLE_API_DEPLOY is not 'true': nothing is deployed," \
              "so v$VERSION is not tagged. Turn it on and re-run all jobs."
            echo "- Produccion: skipped, switched off (\`ENABLE_API_DEPLOY\` is not \`true\`); no tag" >> "$GITHUB_STEP_SUMMARY"
          fi

  produccion:
    name: Produccion (configuration redeploy)
    needs: candidate
    # Switch: ENABLE_API_DEPLOY (deploy.yml gates its deploy job with it too).
    if: needs.candidate.outputs.released != 'true' && vars.ENABLE_API_DEPLOY == 'true'
    # deploy.yml's deploy job runs in the environment `produccion` (required reviewers approve there).
    uses: ./.github/workflows/deploy.yml
    # The called job runs in `produccion`: its environment secrets only reach a reusable workflow
    # through `secrets: inherit`.
    secrets: inherit
    permissions:
      contents: read
      actions: read # the deploy lock
    with:
      api_tag: ""
      roles: all
      superseded_ref: main
      check_only: false
      reason: >-
        te-tengo-infra release ${{ needs.candidate.outputs.version }} (candidate ${{ needs.candidate.outputs.candidate }},
        commit ${{ github.sha }})

  release:
    name: Tag vX.Y.Z and GitHub Release
    needs: [candidate, produccion]
    # Tag at the end: only after the configuration was really deployed (not switched off, failed, rejected or
    # superseded by a newer push to main).
    if: >-
      !cancelled()
      && needs.candidate.result == 'success'
      && needs.candidate.outputs.released != 'true'
      && needs.produccion.result == 'success'
      && needs.produccion.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # the tag vX.Y.Z and its GitHub Release
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.candidate.outputs.version }}
      CANDIDATE: ${{ needs.candidate.outputs.candidate }}
      BUILD: ${{ needs.candidate.outputs.build }}
      COMMIT: ${{ needs.candidate.outputs.commit }}
      TREE: ${{ needs.candidate.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Create the tag and the GitHub Release v${{ needs.candidate.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          notes="$RUNNER_TEMP/notes.md"
          # The CHANGELOG.md section "## [x.y.z] ..." up to the next "## [" heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::warning::CHANGELOG.md has no section [$VERSION]; the release notes point to the file."
            echo "See [CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$tag/CHANGELOG.md)." > "$notes"
          fi
          deployed="deployed to produccion: the whole site.yml (base, docker, app, backup) with the API image the host already ran"
          cat >> "$notes" <<EOF

          ### Candidate
          Promoted candidate [\`v$CANDIDATE\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$CANDIDATE)
          (build $BUILD, commit \`$COMMIT\`, tree \`$TREE\`); $deployed.
          EOF
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --latest --notes-file "$notes"
          {
            echo "Created the tag \`$tag\` on \`$GITHUB_SHA\` and its GitHub Release (candidate \`$CANDIDATE\`)."
          } >> "$GITHUB_STEP_SUMMARY"

  back-merge:
    name: Back-merge into develop
    needs: [candidate, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check the release bot configuration
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error title=Release bot not configured::The organization variable RELEASE_APP_ID and the organization secret" \
              "RELEASE_APP_PRIVATE_KEY (GitHub App te-tengo-release-bot) are required to open the back-merge pull request." \
              "Nothing falls back to GITHUB_TOKEN: its pull requests start no workflows."
            exit 1
          fi
      - name: Mint the release bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The App ID; GitHub accepts it as the JWT issuer like the client ID.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # auto-merge
          permission-pull-requests: write
      - name: Open the back-merge pull requests
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: .github/scripts/back-merge.sh "$VERSION"
