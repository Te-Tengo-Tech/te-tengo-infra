---
- name: Validate required settings
  ansible.builtin.assert:
    that:
      - app_public_hostname | length > 0
      - app_public_hostname is match('^[A-Za-z0-9.-]+$')
      - app_cert_issuer in app_cert_dirs
      - app_cert_issuer != 'acme' or app_acme_email | length > 0
      - app_memory_profile in app_memory_profiles
      - app_api_source in ['registry', 'archive', 'build']
      - app_registry_auth in ['none', 'login']
      - app_clips_bucket | length > 0
      - app_object_storage_region | length > 0
      - app_object_storage_auth in ['static', 'instance_role']
      - app_object_storage_endpoint == '' or app_object_storage_endpoint is match('^https?://[A-Za-z0-9.-]+(:[0-9]+)?$')
      - app_mail_provider in ['smtp', 'ses', 'registro']
      - app_mail_provider != 'ses' or (app_ses_sender | length > 0 and app_aws_region | length > 0)
      - app_mail_provider != 'smtp' or (app_smtp_sender | length > 0 and app_smtp_port | int > 0)
      - app_smtp_security in ['starttls', 'ssl', 'none']
      - app_push_provider != 'sns' or app_aws_region | length > 0
      - app_push_provider in ['fcm', 'sns', 'registro']
      - app_push_provider != 'sns' or app_sns_platform_application_arn | length > 0
      - app_rtsps_port | int > 0
      - app_hls_allow_origins | length > 0
      - app_hls_allow_origins | select('search', '[,\\s]') | list | length == 0
    fail_msg: >-
      Missing or invalid settings. From the Terraform inventory: app_hostname, clips_s3_bucket,
      object_storage_region (or aws_region), object_storage_auth (static or instance_role),
      object_storage_endpoint (an http(s) URL without a path, or empty for AWS), memory_profile (one of
      {{ app_memory_profiles.keys() | join(', ') }}), push_provider (fcm, sns or registro; sns needs
      sns_platform_application_arn and aws_region) and live_view_publish_port. From
      group_vars/te_tengo/vars.yml: te_tengo_acme_email, te_tengo_api_source (registry, archive or build),
      te_tengo_registry_auth (none or login), the mail provider (smtp needs te_tengo_smtp_sender and
      te_tengo_smtp_port, te_tengo_smtp_security starttls/ssl/none; ses needs ses_sender and aws_region).
    quiet: true

- name: Validate the vault
  ansible.builtin.assert:
    that:
      - vault_postgres_password | default('') | length >= 16
      - "'BEGIN PRIVATE KEY' in vault_jwt_private_key_pem | default('')"
      - vault_jwt_private_key_pem | default('') | length > 1000
      - "'BEGIN PUBLIC KEY' in vault_jwt_public_key_pem | default('')"
      - vault_jwt_public_key_pem | default('') | length > 200
      - vault_mediamtx_auth_secret | default('') | length >= 32
      - vault_mediamtx_auth_secret | default('') is match('^[A-Za-z0-9_-]+$')
    fail_msg: >-
      Invalid vault: vault_postgres_password (16+ characters), vault_jwt_private_key_pem (PKCS#8 PEM),
      vault_jwt_public_key_pem (X.509 PEM) and vault_mediamtx_auth_secret (32+ URL-safe characters,
      e.g. openssl rand -hex 32) are required. See group_vars/te_tengo/vault.yml.example.
    quiet: true

- name: Validate the object storage keys
  ansible.builtin.assert:
    that:
      - vault_clips_s3_access_key_id | default('') | length > 0
      - vault_clips_s3_secret_access_key | default('') | length > 0
    fail_msg: >-
      object_storage_auth is static (Cloudflare R2) but vault_clips_s3_access_key_id or
      vault_clips_s3_secret_access_key is empty (an R2 API token with Object Read & Write on the clips bucket).
    quiet: true
  when: app_object_storage_auth == 'static'

- name: Validate the SMTP credentials
  ansible.builtin.assert:
    that:
      - vault_smtp_password | default('') | length > 0
    fail_msg: te_tengo_smtp_host is set but vault_smtp_password is empty (the SMTP relay's password or API key).
    quiet: true
  when: app_mail_provider == 'smtp' and vault_smtp_username | default('') | length > 0

- name: Validate the Firebase key
  ansible.builtin.assert:
    that:
      - vault_fcm_credentials_json | default('') | length > 0
      - (vault_fcm_credentials_json | from_json).type | default('') == 'service_account'
    fail_msg: te_tengo_push_provider is fcm but vault_fcm_credentials_json is not a Firebase service-account JSON key.
    quiet: true
  when: app_push_provider == 'fcm'

- name: Validate registry credentials
  ansible.builtin.assert:
    that:
      - app_registry_username | length > 0
      - vault_registry_password | default('') | length > 0
    fail_msg: te_tengo_registry_auth is login but te_tengo_registry_username or vault_registry_password is empty.
    quiet: true
  when: app_api_source == 'registry' and app_registry_auth == 'login'

- name: Validate the image source
  ansible.builtin.assert:
    that:
      - app_api_source != 'archive' or app_api_archive is file
      - app_api_source != 'build' or (app_api_build_src ~ '/.git') is exists
    fail_msg: >-
      te_tengo_api_archive must be an existing `docker save` file (archive), or te_tengo_api_build_src a git
      checkout of te-tengo-general-api (build), on the machine that runs Ansible.
    quiet: true

- name: Reject values the env files cannot hold
  ansible.builtin.assert:
    that:
      - app_unsafe_env_keys | length == 0
    fail_msg: "These settings contain a single quote or a line break: {{ app_unsafe_env_keys | join(', ') }}"
    quiet: true
  vars:
    app_unsafe_env_keys: >-
      {{ app_compose_env | combine(app_api_env) | dict2items
         | selectattr('value', 'search', "['\n\r]") | map(attribute='key') | list }}

- name: Inspect the current deployment
  ansible.builtin.stat:
    path: "{{ app_dir }}/compose.yaml"
    get_checksum: false
  register: app_compose_file

- name: Remember whether the stack was already deployed (handlers only restart a running stack)
  ansible.builtin.set_fact:
    app_stack_existed: "{{ app_compose_file.stat.exists }}"

- name: Create the application directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.owner | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ app_dir }}", mode: "0750" }
    - { path: "{{ app_dir }}/caddy", mode: "0755" }
    - { path: "{{ app_dir }}/mediamtx", mode: "0755" }
    - { path: "{{ app_secrets_dir }}", mode: "0700", owner: "{{ app_api_uid }}" }
  loop_control:
    label: "{{ item.path }}"

- name: Install the Compose file
  ansible.builtin.copy:
    src: "{{ app_compose_src_dir }}/compose.yaml"
    dest: "{{ app_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0640"

- name: Install the Caddyfile
  ansible.builtin.copy:
    src: "{{ app_compose_src_dir }}/caddy/Caddyfile"
    dest: "{{ app_dir }}/caddy/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  notify: Reload caddy

- name: Install the MediaMTX configuration
  ansible.builtin.copy:
    src: "{{ app_compose_src_dir }}/mediamtx/mediamtx.yml"
    dest: "{{ app_dir }}/mediamtx/mediamtx.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart mediamtx

- name: Render the Compose environment file
  ansible.builtin.template:
    src: dotenv.j2
    dest: "{{ app_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  vars:
    app_dotenv: "{{ app_compose_env }}"
  no_log: true

- name: Render the API environment file
  ansible.builtin.template:
    src: dotenv.j2
    dest: "{{ app_dir }}/api.env"
    owner: root
    group: root
    mode: "0600"
  vars:
    app_dotenv: "{{ app_api_env }}"
  no_log: true

- name: Write the JWT keys
  ansible.builtin.copy:
    content: "{{ item.content | trim }}\n"
    dest: "{{ app_secrets_dir }}/{{ item.name }}"
    owner: "{{ app_api_uid }}"
    group: "{{ app_api_uid }}"
    mode: "0600"
  loop:
    - { name: jwt-privada.pem, content: "{{ vault_jwt_private_key_pem }}" }
    - { name: jwt-publica.pem, content: "{{ vault_jwt_public_key_pem }}" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: Restart api

- name: Write the Firebase service-account key
  ansible.builtin.copy:
    content: "{{ vault_fcm_credentials_json | trim }}\n"
    dest: "{{ app_secrets_dir }}/fcm.json"
    owner: "{{ app_api_uid }}"
    group: "{{ app_api_uid }}"
    mode: "0600"
  no_log: true
  notify: Restart api
  when: app_push_provider == 'fcm'

- name: Remove the Firebase key when FCM is not used
  ansible.builtin.file:
    path: "{{ app_secrets_dir }}/fcm.json"
    state: absent
  when: app_push_provider != 'fcm'

- name: Log in to the container registry
  ansible.builtin.include_tasks: registry.yml
  when: app_api_source == 'registry' and app_registry_auth == 'login'

- name: Load the API image from an archive
  ansible.builtin.include_tasks: archive.yml
  when: app_api_source == 'archive'

- name: Build the API image on the host
  ansible.builtin.include_tasks: build.yml
  when: app_api_source == 'build'

- name: Start or update the stack
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    state: present
    pull: "{{ 'always' if app_api_source == 'registry' else 'missing' }}"
    remove_orphans: true
    wait: true
    wait_timeout: "{{ app_compose_wait_timeout }}"

- name: Remove dangling images
  ansible.builtin.command:
    cmd: docker image prune --force
  register: app_prune
  changed_when: "'Total reclaimed space: 0B' not in app_prune.stdout"

- name: Apply configuration changes to the running stack
  ansible.builtin.meta: flush_handlers

- name: Check the deployment over HTTPS
  ansible.builtin.include_tasks: verify.yml
  when: app_verify | bool
