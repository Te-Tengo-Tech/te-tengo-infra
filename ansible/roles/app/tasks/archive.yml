---
- name: Create the image archive directory
  ansible.builtin.file:
    path: "{{ app_dir }}/images"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Upload the API image archive
  ansible.builtin.copy:
    src: "{{ app_api_archive }}"
    dest: "{{ app_dir }}/images/te-tengo-general-api{{ '.tar.gz' if app_api_archive is search('\\.gz$') else '.tar' }}"
    owner: root
    group: root
    mode: "0640"
  register: app_api_archive_upload

- name: Inspect the loaded API image
  ansible.builtin.command:
    cmd: docker image inspect {{ app_api_local_image }}
  register: app_api_local_image_info
  changed_when: false
  failed_when: false

- name: Load the API image
  ansible.builtin.command:
    cmd: docker load --input {{ app_api_archive_upload.dest }}
  register: app_api_load
  when: app_api_archive_upload.changed or app_api_local_image_info.rc != 0
  changed_when: true

- name: Require the API image named by the archive
  ansible.builtin.command:
    cmd: docker image inspect {{ app_api_local_image }}
  changed_when: false
