---
- name: Package the API sources on the controller
  ansible.builtin.command:
    cmd: >-
      git -C {{ app_api_build_src }} archive --format=tar.gz
      --output {{ app_api_build_tarball }} {{ app_api_build_ref }}
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true

- name: Reset the build directory
  ansible.builtin.file:
    path: "{{ app_dir }}/src/te-tengo-general-api"
    state: "{{ item }}"
    owner: root
    group: root
    mode: "0750"
  loop: [absent, directory]

- name: Unpack the API sources on the host
  ansible.builtin.unarchive:
    src: "{{ app_api_build_tarball }}"
    dest: "{{ app_dir }}/src/te-tengo-general-api"
    owner: root
    group: root

- name: Provide a Dockerfile when the checkout has none
  ansible.builtin.copy:
    src: "{{ app_api_build_dockerfile }}"
    dest: "{{ app_dir }}/src/te-tengo-general-api/Dockerfile"
    owner: root
    group: root
    mode: "0644"
    force: false
  when: app_api_build_dockerfile | length > 0

- name: Build the API image
  ansible.builtin.command:
    cmd: docker build --pull --tag {{ app_api_local_image }} {{ app_dir }}/src/te-tengo-general-api
  async: "{{ app_api_build_timeout }}"
  poll: 15
  changed_when: true

- name: Remove the build cache
  ansible.builtin.command:
    cmd: docker builder prune --force
  changed_when: true
