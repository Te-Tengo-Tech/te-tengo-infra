---
# Test-only overrides, passed as extra vars (-e @test/vars.yml) so they win over group_vars.
# No cloud account, no real secret: Caddy's internal CA, Azurite for Azure Blob Storage, e-mail and push
# only logged.
te_tengo_cert_issuer: internal
te_tengo_acme_email: ops@tetengo.test
te_tengo_api_source: archive
te_tengo_api_archive: "{{ playbook_dir }}/../test/.work/te-tengo-general-api.tar"
te_tengo_push_provider: registro
# No SMTP relay in the test (te_tengo_smtp_host empty) and no SES sender: TT_CORREO_PROVEEDOR=registro.
# The API gets no AWS credentials and no S3 settings: clips are signed with Azurite's account key
# (TT_AZURE_STORAGE_CLAVE), the only difference from production's managed identity.

# The test host shares Docker Desktop's kernel (or the CI runner's), so leave its swap, sysctls and
# zswap alone. The privileged container could otherwise write /sys/module/zswap.
base_manage_swap: false
base_manage_sysctl: false
base_manage_zswap: false
