---
# Local test inventory: the shape Terraform renders for the production VM (envs/azure,
# docs/interface-terraform-ansible.md), pointing to the tt-test-host container over plain SSH. The
# Makefile passes cloud_provider and memory_profile as extra vars (TEST_CLOUD, TEST_MEMORY_PROFILE), so
# the OCI path can be tested too: make test-all TEST_CLOUD=oci TEST_MEMORY_PROFILE=small TEST_HOST_MEM=2g. Azurite
# plays the storage account: the same containers, but the emulator's account devstoreaccount1 over HTTP
# with its published key from the vault (object_storage_auth: static) instead of the VM's managed identity
# over HTTPS (managed_identity, production).
all:
  children:
    te_tengo:
      hosts:
        te-tengo-test:
          ansible_host: 127.0.0.1
          ansible_port: 18022
          ansible_user: ubuntu
          ansible_connection: ssh
          ansible_ssh_private_key_file: "{{ inventory_dir }}/.work/id_ed25519"
          ansible_python_interpreter: /usr/bin/python3
          # Terraform interface variables (docs/interface-terraform-ansible.md).
          app_hostname: localhost
          public_ip: 127.0.0.1
          cloud_provider: azure  # make TEST_CLOUD=...
          cloud_region: local
          memory_profile: tiny  # make TEST_MEMORY_PROFILE=...
          instance_architecture: amd64
          object_storage_provider: azure
          object_storage_auth: static  # production: managed_identity
          azure_storage_endpoint: http://10.231.0.10:10000/devstoreaccount1  # https://<account>.blob.core.windows.net
          azure_storage_account: devstoreaccount1
          clips_container: clips
          movements_container: movements
          backups_container: backups
          ses_sender: ""
          push_provider: fcm  # overridden by test/vars.yml: registro, no Firebase key in the test
          sns_platform_application_arn: ""
          live_view_publish_port: 8322
          live_view_webrtc_port: 8189
