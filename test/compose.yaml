# Local stand-in for the production host, without any cloud account (make test-host-up / test-down).
# - host:  Ubuntu 24.04 + systemd + OpenSSH, privileged (Docker-in-Docker), playing the production VM
#          (Azure Standard_B2ats_v2 by default). Its ports 22/443/80/8322 are published on the Mac as
#          18022/18443/18081/18322. Its memory is capped like the VM's (TT_TEST_HOST_MEM, 1g by default,
#          plus swap up to TT_TEST_HOST_MEMSWAP from Docker's own VM): every nested container counts.
# - azurite: Microsoft's Azure Storage emulator (blob service only). It stands in for the storage account
#          Terraform creates: containers clips, movements and backups (created by test/prepare.sh), the
#          well-known development account devstoreaccount1 and its published key (static auth; production
#          uses the VM's managed identity, which Azurite cannot emulate). Fixed address 10.231.0.10, so the
#          endpoint http://10.231.0.10:10000/devstoreaccount1 is "IP style" (account in the path) for the
#          Azure SDK and azcopy, and the API, the backup job inside the host and the smoke test on the Mac
#          (published on 31000) all use the same SAS URLs.
# Ports avoid the ones the developer's own stacks use (8080, 4566, 5432, 8554, 8888, 9997, 443, 10000).
name: tt-infra-test

services:
  host:
    build: ./host
    container_name: tt-test-host
    hostname: te-tengo-test
    privileged: true
    cgroup: private
    mem_limit: ${TT_TEST_HOST_MEM:-1g}
    memswap_limit: ${TT_TEST_HOST_MEMSWAP:-3g}
    tmpfs:
      - /run
      - /run/lock
    volumes:
      # Docker 29 keeps images in containerd's snapshotter: both stores need a real (non-overlay)
      # filesystem for the nested overlay mounts.
      - host-docker:/var/lib/docker
      - host-containerd:/var/lib/containerd
    ports:
      - "127.0.0.1:18022:22"
      - "127.0.0.1:18443:443/tcp"
      - "127.0.0.1:18443:443/udp"
      - "127.0.0.1:18081:80"
      - "127.0.0.1:18322:8322"
    networks:
      - test

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    container_name: tt-test-azurite
    # --skipApiVersionCheck: the API's Azure SDK may send a newer x-ms-version than this Azurite knows.
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --blobPort
      - "10000"
      - --inMemoryPersistence
      - --skipApiVersionCheck
      - --disableProductStyleUrl
    ports:
      - "127.0.0.1:31000:10000"
    networks:
      test:
        ipv4_address: 10.231.0.10
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:10000/devstoreaccount1?comp=list', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 30

networks:
  test:
    ipam:
      config:
        # Dynamic addresses (the host, the smoke test's publisher) come from the upper half; Azurite's fixed
        # address is outside it.
        - subnet: 10.231.0.0/24
          ip_range: 10.231.0.128/25

volumes:
  host-docker: {}
  host-containerd: {}
